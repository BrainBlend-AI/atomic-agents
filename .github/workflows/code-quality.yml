name: Code Quality & Tests

on:
  push:
    branches: [ main, v2.0 ]
  pull_request:
    branches: [ main, v2.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-python-${{ runner.python-version }}-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-python-${{ runner.python-version }}-

      - name: Install Dependencies
        run: |
          uv sync
          uv run pip list  # Verify installation

      - name: Verify Black Installation
        run: |
          uv run which black || echo "Black not found"
          uv run black --version

      - name: Run Black Check
        run: |
          uv run black --check atomic-agents atomic-assembler atomic-examples atomic-forge
        if: success()

      - name: Run Flake8
        run: uv run flake8 --extend-exclude=.venv atomic-agents atomic-assembler atomic-examples atomic-forge
        if: success()

      - name: Run Tests
        run: uv run pytest --cov=atomic_agents atomic-agents
        if: success()

  fresh-install:
    name: Fresh install imports every subpackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel into a clean environment without the lockfile
        run: |
          uv venv fresh-install-venv
          uv pip install --python fresh-install-venv "atomic-agents[observability] @ $(ls dist/*.whl)"

      - name: Import every subpackage the way a new user would
        run: |
          fresh-install-venv/bin/python - <<'PY'
          import importlib
          import pkgutil

          import atomic_agents

          module_names = [module.name for module in pkgutil.walk_packages(atomic_agents.__path__, prefix="atomic_agents.")]
          failures = []
          for module_name in module_names:
              try:
                  importlib.import_module(module_name)
              except Exception as error:
                  failures.append(f"{module_name}: {type(error).__name__}: {error}")
          print(f"imported {len(module_names)} modules from {atomic_agents.__file__}")
          for failure in failures:
              print(failure)
          if failures:
              raise SystemExit(1)
          PY

  lowest-versions:
    name: Tests on the lowest allowed version of every direct dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Resolve runtime dependencies at their declared floors
        run: |
          echo 'opentelemetry-instrumentation==0.51b0' > telemetry-test-requirements.txt
          uv pip compile pyproject.toml telemetry-test-requirements.txt --resolution lowest-direct --extra observability -o lowest-requirements.txt

      - name: Install the floors plus current test tooling
        run: |
          uv venv lowest-venv
          uv pip install --python lowest-venv -r lowest-requirements.txt pytest pytest-asyncio pytest-cov opentelemetry-instrumentation==0.51b0
          uv pip install --python lowest-venv --no-deps -e .

      - name: Show resolved versions
        run: lowest-venv/bin/python -c "import importlib.metadata as m; print(' '.join(p + '=' + m.version(p) for p in ['instructor', 'openai', 'pydantic', 'mcp', 'litellm']))"

      - name: Run Tests
        run: lowest-venv/bin/python -m pytest atomic-agents
